{% set name = "pyls-memestra" %}
{% set version = "0.0.16" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ccc543776b81e339f0dfccf7c9bd0db7ba901f97461d36d004864efeaa35fedf

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - pyyaml
    - python-lsp-server
    - memestra
    - deprecated
    - frilouz >=0.0.2
    # autopep8 >1.5.5 conflicts with python-language-server because of pycodestyle versions
    - autopep8 =1.5.5

test:
  requires:
    - pip
    - python {{ python_min }}
  imports:
    - pyls_memestra
  commands:
    - pip check

about:
  home: https://github.com/QuantStack/pyls-memestra/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Memestra plugin for the Python Language Server

extra:
  recipe-maintainers:
    - marimeireles
    - SylvainCorlay
